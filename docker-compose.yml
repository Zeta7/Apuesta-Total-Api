services:
  api:
    build: .
    command: sh -c "pnpm prisma:migrate && pnpm db:seed && node dist/src/main.js"
    env_file: .env
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      localstack: { condition: service_healthy }

  worker:
    build: .
    command: node dist/src/worker.js
    env_file: .env
    depends_on:
      api: { condition: service_started }
      localstack: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: apuestasDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['55432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d apuestasDB']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ['56379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:4.7
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports: ['4566:4566']
    volumes:
      - ./docker/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ['CMD', 'curl', '-f']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
